name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Says whether anything other than documentation changed, so that the
  # test matrix and e2e-kind can be skipped for a change to docs/ or
  # Markdown alone.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A push can hold several commits, so the one before it may be
          # far back.
          fetch-depth: 0
      - id: diff
        env:
          # A pull request's merge commit has the base branch as its first
          # parent; a push names the commit it moved the branch from.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # An unknown base (a new branch, or history rewritten by a force
          # push) gives no list of files, so run everything.
          if ! files=$(git diff --name-only "$BASE" HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              # Go reads these: docs/go.mod keeps the docs site out of the
              # module, a test compares the page with the AI prompts, and
              # Markdown under internal/ is embedded in the binary.
              docs/go.mod | docs/content/docs/guides/ai-explanations.mdx | internal/*) code=true ;;
              docs/* | *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS covers the keychain, session and process code that differs
        # from Linux; runners are free now that the repository is public.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install shells for hook syntax checks
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh fish
      # internal/cli alone takes 7 to 10 minutes with the race detector on
      # these runners, so go test's default limit of 10 minutes per package
      # stopped it more than once.
      - run: go test -race -timeout 20m ./...
      # This uses the runner's python3. go test above has already run the
      # SDK's example through the conformance suite and compared the SDK's
      # output with the Go SDK's.
      - name: Python SDK tests
        if: runner.os == 'Linux'
        run: make python-sdk-test

  # Each suite of scripts/e2e-kind.sh runs on new clusters of its own, in
  # parallel, so the e2e run takes as long as the slowest suite.
  e2e-kind:
    name: e2e-kind (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [core, commands, flux, argocd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          cluster_name: tug-e2e
      # tug drift compares the cluster with a second one, made with the
      # same kind, and so the same Kubernetes version.
      - name: Create a second cluster
        if: matrix.suite == 'commands'
        run: kind create cluster --name tug-e2e-b --wait 120s
      - run: make build
      - run: TUG_BIN=$PWD/bin/tug KIND_CLUSTER=tug-e2e KIND_CLUSTER_B=tug-e2e-b ./scripts/e2e-kind.sh ${{ matrix.suite }}

  # A fast config check on every push. The full snapshot build (about ten
  # minutes for six targets) runs in release-snapshot.yml only when release
  # configuration changes.
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
