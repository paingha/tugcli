    removedIn: "1.22"
    replacement: rbac.authorization.k8s.io/v1
    replacementSince: "1.8"
  - groupVersion: scheduling.k8s.io/v1beta1
    kinds: [PriorityClass]
    removedIn: "1.22"
    replacement: scheduling.k8s.io/v1
    replacementSince: "1.14"
  - groupVersion: storage.k8s.io/v1beta1
