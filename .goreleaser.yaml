# GoReleaser: signed binaries for macOS, Linux and Windows (Phase 0).
version: 2

project_name: tug

before:
  hooks:
    - go mod tidy
    # The first-party plugins: one archive each, holding every platform's
    # binary with its sha256 in the manifest, ready for `tug plugin install`.
    - make plugins-dist PLUGINS_OUT=build/plugins

builds:
  - id: tug
    main: ./cmd/tug
    binary: tug
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/paingha/tugcli/internal/version.version={{ .Version }}
      - -X github.com/paingha/tugcli/internal/version.commit={{ .FullCommit }}
      - -X github.com/paingha/tugcli/internal/version.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  # The plugin archives are listed too, so the signed checksums.txt covers
  # them and gives users the --sha256 for `tug plugin install`.
  extra_files:
    - glob: ./build/plugins/*.tar.gz

release:
  extra_files:
    - glob: ./build/plugins/*.tar.gz

# Keyless signing with Sigstore; the release workflow grants id-token: write.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
      - --yes

sboms:
  - artifacts: archive

# The Python SDK is released from sdk/python/v* tags by its own workflow;
# they must never count as tug's previous or current version.
git:
  ignore_tags:
    - "sdk/*"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# Package managers. Each publishes to its own repository with TAP_TOKEN, a
# token that can push to paingha/homebrew-tap, paingha/scoop-bucket and
# paingha/krew-index. Without the secret they are skipped, so a release
# still works before the repositories exist. skip_upload reads TAP_TOKEN
# with index, which gives "" when the variable is not set at all, as in
# snapshot builds, where .Env.TAP_TOKEN would fail. token must stay exactly
# {{ .Env.TAP_TOKEN }}: GoReleaser reads the variable itself and refuses any
# other template there.
homebrew_casks:
  - name: tug
    binaries: [tug]
    repository: {owner: paingha, name: homebrew-tap, token: "{{ .Env.TAP_TOKEN }}"}
    homepage: https://github.com/paingha/tugcli
    description: Reach Kubernetes clusters across providers, one terminal at a time
    skip_upload: '{{ if not (index .Env "TAP_TOKEN") }}true{{ end }}'
    hooks:
      post:
        # The binary is signed with Sigstore, not notarised by Apple, so
        # macOS would quarantine it on first run.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tug"]
          end

scoops:
  - name: tug
    repository: {owner: paingha, name: scoop-bucket, token: "{{ .Env.TAP_TOKEN }}"}
    homepage: https://github.com/paingha/tugcli
    description: Reach Kubernetes clusters across providers, one terminal at a time
    license: MIT
    skip_upload: '{{ if not (index .Env "TAP_TOKEN") }}true{{ end }}'

# A custom krew index: kubectl krew index add tug https://github.com/paingha/krew-index
krews:
  - name: tug
    repository: {owner: paingha, name: krew-index, token: "{{ .Env.TAP_TOKEN }}"}
    homepage: https://github.com/paingha/tugcli
    short_description: Reach clusters across providers with sessions and guardrails
    description: |
      tug finds clusters across providers, keeps their credentials in the OS
      keychain, and points each terminal at one cluster without touching
      ~/.kube/config. As a kubectl plugin it runs as `kubectl tug`.
    skip_upload: '{{ if not (index .Env "TAP_TOKEN") }}true{{ end }}'
