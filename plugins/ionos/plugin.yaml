apiVersion: tug.plugin/v1alpha1
kind: ProviderPlugin
metadata:
  name: ionos
  version: 0.1.1
  publisher: tug
  homepage: https://github.com/paingha/tugcli/tree/main/plugins/ionos
spec:
  protocols: [provider/v1alpha1]
  capabilities: [list, credential, serve]
  platforms:
  - {os: darwin, arch: arm64, bin: bin/darwin_arm64/tug-provider-ionos}
  - {os: darwin, arch: amd64, bin: bin/darwin_amd64/tug-provider-ionos}
  - {os: linux, arch: amd64, bin: bin/linux_amd64/tug-provider-ionos}
  - {os: linux, arch: arm64, bin: bin/linux_arm64/tug-provider-ionos}
  - {os: windows, arch: amd64, bin: bin/windows_amd64/tug-provider-ionos.exe}
  secrets:
  - {name: api_token, prompt: "IONOS Cloud API token"}
  env: []
  network: [api.ionos.com]
  accountConfig:
    type: object
    properties:
      apiURL: {type: string, description: "API endpoint override (https)"}
      contract: {type: string, description: "contract number to act in, for users with several contracts"}
