apiVersion: tug.plugin/v1alpha1
kind: ProviderPlugin
metadata:
  name: digitalocean
  version: 0.1.0
  publisher: tug
  homepage: https://github.com/paingha/tugcli/tree/main/plugins/digitalocean
spec:
  protocols: [provider/v1alpha1]
  capabilities: [list, credential, serve]
  platforms:
  - {os: darwin, arch: arm64, bin: bin/darwin_arm64/tug-provider-digitalocean}
  - {os: darwin, arch: amd64, bin: bin/darwin_amd64/tug-provider-digitalocean}
  - {os: linux, arch: amd64, bin: bin/linux_amd64/tug-provider-digitalocean}
  - {os: linux, arch: arm64, bin: bin/linux_arm64/tug-provider-digitalocean}
  - {os: windows, arch: amd64, bin: bin/windows_amd64/tug-provider-digitalocean.exe}
  - {os: windows, arch: arm64, bin: bin/windows_arm64/tug-provider-digitalocean.exe}
  secrets:
  - {name: api_token, prompt: "DigitalOcean personal access token (kubernetes:read and kubernetes:access_cluster)"}
  env: []
  network: [api.digitalocean.com]
  accountConfig:
    type: object
    properties:
      apiURL: {type: string, description: "API endpoint override (https)"}
